<script>
  const data = JSON.parse(document.getElementById('dashboard-data').textContent);

  const money = (n) => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const moneyCompact = (n) => {
    const abs = Math.abs(n);
    if (abs >= 1000) return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    return money(n);
  };
  const pct = (n, digits = 1) => (n * 100).toFixed(digits) + '%';
  const signedPct = (n, digits = 1) => (n >= 0 ? '+' : '') + pct(n, digits);
  const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function formatDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }
  function formatDateShort(iso) {
    if (!iso) return '—';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  document.getElementById('as-of').textContent = 'As of ' + formatDate(data.last_updated);
  document.getElementById('footer-updated').textContent = 'Last run: ' + formatDate(data.last_updated);

  const pill = document.getElementById('status-pill');
  const statusText = document.getElementById('status-text');
  if (data.status === 'active') {
    pill.classList.add('active');
    statusText.textContent = 'Active';
  } else {
    statusText.textContent = 'Awaiting import';
  }

  const holdingsCount = data.holdings.length;
  const history = data.performance_history || [];
  const benchmarkTicker = data.benchmark_ticker || 'benchmark';

  // ---- Stat tiles ----
  const tiles = document.getElementById('tiles');
  const largest = data.holdings.slice().sort((a, b) => b.pct_of_portfolio - a.pct_of_portfolio)[0];
  const cashPct = data.total_value ? data.cash / data.total_value : 0;

  const opp = data.opportunity_bucket || { pct: 0, cap_pct: 0, near_cap: false, over_cap: false };
  const tileDefs = [
    { label: 'Total value', value: moneyCompact(data.total_value), sub: data.status === 'active' ? holdingsCount + ' holdings' : 'Not yet funded' },
    { label: 'Cash', value: moneyCompact(data.cash), sub: data.status === 'active' ? pct(cashPct) + ' of portfolio' : ' ' },
    { label: 'Positions', value: String(holdingsCount), sub: 'target 15–25' },
    { label: 'Largest position', value: largest ? largest.ticker : '—', sub: largest ? pct(largest.pct_of_portfolio) + ' of portfolio' : ' ' },
  ];
  if (data.status === 'active') {
    const oppFlag = opp.over_cap ? ' · over cap' : (opp.near_cap ? ' · near cap' : '');
    tileDefs.push({
      label: 'Opportunity tier',
      value: pct(opp.pct),
      sub: 'of ' + pct(opp.cap_pct, 0) + ' cap' + oppFlag,
      subClass: opp.over_cap ? 'loss' : (opp.near_cap ? 'accent-warn' : ''),
    });
  }
  if (data.status === 'active') {
    if (history.length >= 2) {
      const last = history[history.length - 1];
      const diff = (last.portfolio_return_pct ?? 0) - (last.benchmark_return_pct ?? 0);
      tileDefs.push({
        label: 'vs ' + benchmarkTicker,
        value: signedPct(diff),
        sub: 'since ' + formatDateShort(history[0].date),
      });
    } else {
      tileDefs.push({ label: 'vs ' + benchmarkTicker, value: '—', sub: 'tracking started today' });
    }
  }
  tiles.innerHTML = tileDefs.map(t => `
    <div class="tile">
      <p class="tile-label">${t.label}</p>
      <div class="tile-value">${t.value}</div>
      <div class="tile-sub${t.subClass ? ' ' + t.subClass : ''}">${t.sub}</div>
    </div>
  `).join('');

  // ---- Performance chart ----
  const perfBody = document.getElementById('performance-body');
  const perfNote = document.getElementById('performance-note');
  if (data.status !== 'active' || history.length === 0) {
    perfNote.textContent = '';
    perfBody.innerHTML = `<div class="empty"><p class="empty-body">Performance tracking begins once the portfolio is funded.</p></div>`;
  } else if (history.length < 2) {
    perfNote.textContent = 'day 1';
    perfBody.innerHTML = `
      <p class="empty-body left">
        Daily value tracking started today (${escapeHtml(formatDate(history[0].date))}). Check back over the
        next few sessions to see the trend against ${escapeHtml(benchmarkTicker)} build up here.
      </p>
    `;
  } else {
    perfNote.textContent = history.length + ' sessions tracked';
    const last = history[history.length - 1];
    const portfolioReturn = last.portfolio_return_pct ?? 0;
    const benchmarkReturn = last.benchmark_return_pct;

    const w = 640, h = 200, padL = 8, padR = 8, padT = 12, padB = 22;
    const xs = history.map((_, i) => padL + (history.length === 1 ? 0 : (i / (history.length - 1)) * (w - padL - padR)));
    const portfolioVals = history.map(d => (d.portfolio_return_pct ?? 0) * 100);
    const benchmarkVals = history.map(d => (d.benchmark_return_pct ?? 0) * 100);
    const known = benchmarkVals.every(v => v !== null && !Number.isNaN(v));
    const allVals = known ? portfolioVals.concat(benchmarkVals) : portfolioVals;
    let minV = Math.min(0, ...allVals), maxV = Math.max(0, ...allVals);
    if (minV === maxV) { minV -= 1; maxV += 1; }
    const vPad = (maxV - minV) * 0.15;
    minV -= vPad; maxV += vPad;
    const yFor = (v) => padT + (1 - (v - minV) / (maxV - minV)) * (h - padT - padB);
    const pathFor = (vals) => vals.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xs[i].toFixed(1)} ${yFor(v).toFixed(1)}`).join(' ');
    const zeroY = yFor(0).toFixed(1);

    perfBody.innerHTML = `
      <div class="chart-legend">
        <span class="chart-legend-item"><span class="chart-swatch" style="background:var(--accent)"></span>Portfolio <span class="chart-delta ${portfolioReturn >= 0 ? 'gain' : 'loss'}">${signedPct(portfolioReturn)}</span></span>
        <span class="chart-legend-item"><span class="chart-swatch" style="background:var(--ink-faint)"></span>${escapeHtml(benchmarkTicker)} <span class="chart-delta ${(benchmarkReturn ?? 0) >= 0 ? 'gain' : 'loss'}">${benchmarkReturn != null ? signedPct(benchmarkReturn) : '—'}</span></span>
      </div>
      <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block; overflow:visible;" preserveAspectRatio="none" role="img" aria-label="Portfolio performance vs ${escapeHtml(benchmarkTicker)}">
        <line x1="${padL}" y1="${zeroY}" x2="${w - padR}" y2="${zeroY}" style="stroke:var(--border); stroke-width:1" />
        ${known ? `<path d="${pathFor(benchmarkVals)}" style="fill:none; stroke:var(--ink-faint); stroke-width:1.5; stroke-dasharray:4 3" />` : ''}
        <path d="${pathFor(portfolioVals)}" style="fill:none; stroke:var(--accent); stroke-width:2.25" />
        <circle cx="${xs[xs.length - 1].toFixed(1)}" cy="${yFor(portfolioVals[portfolioVals.length - 1]).toFixed(1)}" r="3.5" style="fill:var(--accent)" />
        <text x="${padL}" y="${h - 5}" class="chart-axis-label">${escapeHtml(formatDateShort(history[0].date))}</text>
        <text x="${w - padR}" y="${h - 5}" class="chart-axis-label" text-anchor="end">${escapeHtml(formatDateShort(history[history.length - 1].date))}</text>
      </svg>
    `;
  }

  // ---- Holdings table ----
  const holdingsBody = document.getElementById('holdings-body');
  const holdingsNote = document.getElementById('holdings-count-note');
  if (data.status !== 'active' || holdingsCount === 0) {
    holdingsNote.textContent = '';
    holdingsBody.innerHTML = `
      <div class="empty">
        <div class="empty-glyph">§</div>
        <p class="empty-title">This ledger hasn't been opened yet</p>
        <p class="empty-body">Import your current holdings from a broker CSV export to begin daily research and tracking.</p>
        <code class="empty-code">python scripts/import_csv.py --seed data/imports/your_export.csv</code>
      </div>
    `;
  } else {
    holdingsNote.textContent = holdingsCount + ' positions';
    const rows = data.holdings.map(h => {
      const returnKnown = h.return_pct !== null && h.return_pct !== undefined;
      const returnClass = returnKnown ? (h.return_pct >= 0 ? 'gain' : 'loss') : '';
      const returnLabel = returnKnown ? signedPct(h.return_pct) : '—';
      const f = h.fundamentals || {};
      const fwdPE = f.forwardPE != null ? f.forwardPE.toFixed(1) : '—';
      const revGrowth = f.revenueGrowth != null ? signedPct(f.revenueGrowth) : '—';
      const capOver = (h.position_cap_usage_pct ?? 0) >= 1;
      const capTag = capOver
        ? '<span class="cap-tag over">Over cap</span>'
        : (h.near_position_cap ? '<span class="cap-tag warn">Near cap</span>' : '');
      return `
        <tr>
          <td>
            <span class="ticker">${escapeHtml(h.ticker)}</span>${h.opportunity_tier ? '<span class="cap-tag tier">Opportunity</span>' : ''}
            ${h.sector ? `<span class="sector-tag">${escapeHtml(h.sector)}</span>` : ''}
          </td>
          <td class="num">${h.shares}</td>
          <td class="num">${h.cost_basis_per_share != null ? money(h.cost_basis_per_share) : '—'}</td>
          <td class="num">${money(h.price)}</td>
          <td class="num">${money(h.value)}</td>
          <td class="num"><span class="pct-chip ${returnClass}">${returnLabel}</span></td>
          <td class="num">${fwdPE}</td>
          <td class="num">${revGrowth}</td>
          <td class="num">${pct(h.pct_of_portfolio)}${capTag}</td>
        </tr>
      `;
    }).join('');
    holdingsBody.innerHTML = `
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Ticker</th>
              <th class="num">Shares</th>
              <th class="num">Cost basis</th>
              <th class="num">Price</th>
              <th class="num">Value</th>
              <th class="num">Return</th>
              <th class="num">Fwd P/E</th>
              <th class="num">Rev growth</th>
              <th class="num">% of portfolio</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  // ---- Sector allocation ----
  const sectorBody = document.getElementById('sector-body');
  if (!data.sector_allocation || data.sector_allocation.length === 0) {
    sectorBody.innerHTML = `
      <div class="empty">
        <p class="empty-body">No sector data yet.</p>
      </div>
    `;
  } else {
    const sorted = data.sector_allocation.slice().sort((a, b) => b.pct - a.pct);
    sectorBody.innerHTML = `
      <ul class="sector-list">
        ${sorted.map(s => {
          const over = (s.sector_cap_usage_pct ?? 0) >= 1;
          const barClass = over ? 'over' : (s.near_sector_cap ? 'warn' : '');
          const tag = over
            ? '<span class="cap-tag over">Over cap</span>'
            : (s.near_sector_cap ? '<span class="cap-tag warn">Near cap</span>' : '');
          return `
            <li class="sector-row">
              <span class="sector-name">${escapeHtml(s.sector)}${tag}</span>
              <span class="sector-pct">${pct(s.pct)}</span>
              <div class="sector-bar-track"><div class="sector-bar-fill ${barClass}" style="width:${Math.min(100, s.pct * 100).toFixed(1)}%"></div></div>
            </li>
          `;
        }).join('')}
      </ul>
    `;
  }

  // ---- Recent decisions feed ----
  const feedBody = document.getElementById('feed-body');
  if (!data.recent_transactions || data.recent_transactions.length === 0) {
    feedBody.innerHTML = `
      <div class="empty">
        <p class="empty-body">No decisions logged yet. Once the daily research run begins, every buy, sell, trim, or add will appear here with its rationale.</p>
      </div>
    `;
  } else {
    feedBody.innerHTML = `
      <ul class="feed">
        ${data.recent_transactions.map(tx => `
          <li class="feed-entry">
            <span class="feed-date">${escapeHtml(tx.date)}</span>
            <div class="feed-main">
              <span class="feed-action ${escapeHtml(tx.action)}">${escapeHtml(tx.action)}</span>
              <span class="feed-ticker">${escapeHtml(tx.ticker)}</span>
              <div class="feed-rationale">${escapeHtml(tx.rationale)}</div>
            </div>
          </li>
        `).join('')}
      </ul>
    `;
  }

  // ---- Watchlist ----
  const watchlistBody = document.getElementById('watchlist-body');
  const watchlistNote = document.getElementById('watchlist-count-note');
  const watchlist = data.watchlist || { total_screened: 0, top_candidates: [] };
  watchlistNote.textContent = watchlist.total_screened ? watchlist.total_screened + ' screened' : '';
  if (!watchlist.top_candidates || watchlist.top_candidates.length === 0) {
    watchlistBody.innerHTML = `
      <div class="empty">
        <p class="empty-body">No candidates currently clear the growth screen.</p>
      </div>
    `;
  } else {
    watchlistBody.innerHTML = `
      <ul class="watch-list">
        ${watchlist.top_candidates.map(c => `
          <li class="watch-row">
            <div class="watch-main">
              <span class="watch-ticker">${escapeHtml(c.ticker)}</span>${c.opportunity_tier ? '<span class="cap-tag tier">Opportunity</span>' : ''}
              <div class="watch-sector">${escapeHtml(c.sector || '')}${c.notes ? ' · ' + escapeHtml(c.notes) : ''}</div>
              ${c.reasons && c.reasons.length ? `<div class="watch-reason">${escapeHtml(c.reasons.join(' · '))}</div>` : ''}
            </div>
            <span class="watch-score">${Number(c.score).toFixed(1)}</span>
          </li>
        `).join('')}
      </ul>
    `;
  }

  // ---- Data errors ----
  const errorsSlot = document.getElementById('errors-slot');
  if (data.data_errors && data.data_errors.length > 0) {
    errorsSlot.innerHTML = `
      <div class="errors">
        <strong>Data fetch notes</strong> — the following tickers were skipped this run rather than failing the whole update:
        <ul>${data.data_errors.map(e => `<li>${escapeHtml(e)}</li>`).join('')}</ul>
      </div>
    `;
  }
</script>
